<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c24"/>
      <stop offset="100%" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff771a"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#2a3441" stroke-width="6"/>

  <!-- Orange Glow Emblem -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="none" stroke="url(#orangeGrad)" stroke-width="4" opacity="0.6"/>

  <!-- 3D Isometric Cube Outline (PlayCanvas Engine Tribute) -->
  <g transform="translate(256, 256) scale(1.1)" filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="0,-100 86,-50 0,0 -86,-50" fill="url(#orangeGrad)" opacity="0.95"/>
    <!-- Left Face -->
    <polygon points="-86,-50 0,0 0,100 -86,50" fill="#e64d00" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="0,0 86,-50 86,50 0,100" fill="#cc3700" opacity="0.95"/>

    <!-- Inner Stylized "M" for MakuluLinux -->
    <path d="M -45,15 L -45,-25 L 0,10 L 45,-25 L 45,15" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Accent Star -->
  <circle cx="256" cy="430" r="6" fill="#ff771a"/>
</svg>
